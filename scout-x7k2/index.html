<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#2a2870">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<title>Scout · Gentlemen's League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#2a2870;--navy-2:#1c1b4f;--lime:#8dc63f;--lime-2:#a6d95a;--grass-1:#2f7d32;--grass-2:#2a722d;--gold:#f2c230;--red:#e0312f;--ink:#15143a;--card:rgba(255,255,255,.97);--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:repeating-linear-gradient(180deg,var(--grass-1) 0 90px,var(--grass-2) 90px 180px);padding-bottom:40px}
header{background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:4px solid var(--lime)}
header .row{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font:700 26px/1 Oswald;letter-spacing:1px;text-transform:uppercase}
header h1 small{display:block;font:600 12px Inter;color:var(--lime-2);letter-spacing:0;text-transform:none;margin-top:4px}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill b{color:var(--lime-2)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:0 16px}
h2{font:700 20px Oswald;color:#fff;text-transform:uppercase;letter-spacing:1px;margin:22px 2px 10px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
h2 small{font:600 12px Inter;text-transform:none;letter-spacing:0;opacity:.85;margin-left:6px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);border:4px solid var(--lime)}
.card.gold{border-color:var(--gold)}.card.red{border-color:var(--red)}.card.navy{border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.muted{color:var(--muted);font-size:12.5px}
.advice{font-size:15px;line-height:1.5}
.advice .big{font:700 22px Oswald;color:var(--navy);text-transform:uppercase;margin-bottom:6px}
.move{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;font-weight:700}
.move .out{color:var(--red)}.move .in{color:#1e9e3a}
.tag{display:inline-block;font:700 11px Inter;border-radius:6px;padding:1px 6px;background:#eef1f6;color:var(--ink);vertical-align:1px}
.tag.c{background:var(--gold)}.tag.v{background:#d7dbe6}.tag.inj{background:var(--red);color:#fff}.tag.d{background:#f08a24;color:#fff}
.gain{font:700 15px Oswald;color:#1e9e3a}.gain.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:700 11.5px Oswald;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--navy);padding:6px 6px;text-align:left;white-space:nowrap}
td{padding:6px;border-bottom:1px solid #eceef3;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto;border-radius:12px;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pl{display:flex;align-items:center;gap:7px;min-width:0}
.pl img{width:22px;height:22px;object-fit:contain;flex:none}
.pl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{font:700 10px Inter;color:#fff;border-radius:4px;padding:1px 4px;flex:none}
.p1{background:#f2a900}.p2{background:#1e9e3a}.p3{background:#2b7de9}.p4{background:var(--red)}
.fx{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:3px 4px;font:700 11px Inter}
.f1,.f2{background:#1e9e3a;color:#fff}.f3{background:#d7dbe6}.f4{background:#f08a24;color:#fff}.f5{background:var(--red);color:#fff}.f0{background:#eee;color:#999}
.fx small{display:block;font:600 10px Inter;opacity:.9}
.xi{display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#3a8f3d,#2f7d32);border-radius:12px;padding:12px 6px}
.xrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.xp{width:76px;text-align:center;color:#fff;font-size:11.5px;position:relative}
.xp img{width:30px;height:30px;object-fit:contain}
.xp .n{background:#fff;color:var(--ink);font-weight:700;border-radius:5px 5px 0 0;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp .v{background:var(--navy);border-radius:0 0 5px 5px;font:700 12px Oswald;padding:1px}
.xp .tag{position:absolute;top:-4px;right:6px}
.benchrow{display:flex;justify-content:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed #cfd3dd}
.benchrow .xp{color:var(--ink)}
.rate{display:flex;align-items:center;gap:14px}
.grade{font:700 54px/1 Oswald;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--lime);flex:none}
.bar{height:8px;border-radius:99px;background:#e3e6ee;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),#1e9e3a)}
.me td{background:#fff7d6;font-weight:700}
.prog{font:700 12px Oswald}.prog.up{color:#1e9e3a}.prog.down{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:0;border-radius:999px;padding:6px 12px;font:700 12px Oswald;text-transform:uppercase;background:rgba(255,255,255,.85);color:var(--navy);cursor:pointer}
.tabs button.on{background:var(--lime)}
.note{color:#fff;opacity:.85;font-size:12px;margin-top:8px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
@media (max-width:480px){.tbl .pl .pos{display:none}.tbl .pl{gap:5px}header h1{font-size:22px}.pills{margin-left:0}.xp{width:62px;font-size:10.5px}.xp img{width:26px;height:26px}td,th{padding:5px 4px}}
</style>
</head>
<body>
<header><div class="row">
  <h1>🔭 Scout<small id="sub">Privates Analyse-Werkzeug</small></h1>
  <div class="pills" id="pills"></div>
</div></header>
<main id="app"><p class="note" style="margin-top:20px">Lade …</p></main>
<script src="scout.js"></script>
</body>
</html>
