# Holt die FPL-Daten, speichert sie im Projekt und veröffentlicht die Seite auf GitHub Pages.
# Während Premier-League-Spielen alle 20 Minuten (bis 30 Min. nach Spielende), sonst nur 1× täglich.
name: Liga aktualisieren & veröffentlichen

on:
  schedule:
    - cron: '*/20 * * * *'  # alle 20 Min. prüfen – aktualisiert nur, wenn gerade gespielt wird
    - cron: '0 5 * * *'     # täglich 05:00 UTC (07:00 in Österreich) – immer volle Aktualisierung
  push:
    branches: [main]
  workflow_dispatch:        # manuell auslösbar

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Läuft gerade ein Spiel?
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"; echo "Volle Aktualisierung (${{ github.event_name }})"
          else
            node scripts/should-update.js
          fi

      - name: FPL-Daten holen
        if: steps.check.outputs.update == 'true'
        run: node scripts/fetch.js

      - name: Neue Daten speichern
        if: steps.check.outputs.update == 'true'
        run: |
          git config user.name "liga-bot"
          git config user.email "liga-bot@users.noreply.github.com"
          git add data assets/badges
          git diff --cached --quiet || git commit -m "Daten aktualisiert"
          git pull --rebase -X theirs || true
          git push

      - name: Versionskennung setzen (damit Handys keine alten Dateien zeigen)
        if: steps.check.outputs.update == 'true'
        run: sed -i "s/__BUILD__/$(git rev-parse --short HEAD)-$(date +%s)/g" index.html

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.update == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.update == 'true'
        with:
          path: .

      - id: deploy
        if: steps.check.outputs.update == 'true'
        uses: actions/deploy-pages@v4
