# Holt die FPL-Daten, speichert sie im Projekt und veröffentlicht die Seite auf GitHub Pages.
# Aktualisiert nur während Premier-League-Spielen (alle 10 Min.) und bis 3 h nach dem letzten Spiel
# einer Gameweek, dazu 1× täglich morgens. Geprüft wird nur 11:00–01:00 UTC (Anstoßzeiten + Nachlauf). Die kurze Prüfung läuft als eigener Job ohne Pages-Sperre,
# damit sich nichts staut (2026-10-05).
name: Liga aktualisieren & veröffentlichen

on:
  schedule:
    - cron: '*/10 0,11-23 * * *'  # 11–01 Uhr UTC alle 10 Min. prüfen – aktualisiert nur während/kurz nach Spielen
    - cron: '0 5 * * *'     # täglich 05:00 UTC (07:00 in Österreich) – immer volle Aktualisierung
  push:
    branches: [main]
  workflow_dispatch:        # manuell auslösbar

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      update: ${{ steps.check.outputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Läuft gerade ein Spiel?
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"; echo "Volle Aktualisierung (${{ github.event_name }})"
          else
            node scripts/should-update.js
          fi

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # nur ein Veröffentlichen gleichzeitig; ein wartender Lauf wird durch den neueren ersetzt
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: FPL-Daten holen
        run: node scripts/fetch.js

      - name: Neue Daten speichern
        run: |
          git config user.name "liga-bot"
          git config user.email "liga-bot@users.noreply.github.com"
          git add data assets/badges
          git diff --cached --quiet || git commit -m "Daten aktualisiert"
          git pull --rebase -X theirs || true
          git push

      - name: Versionskennung setzen (damit Handys keine alten Dateien zeigen)
        run: sed -i "s/__BUILD__/$(git rev-parse --short HEAD)-$(date +%s)/g" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
